# actions/labeler の設定。PR にブランチ名と変更したファイルからラベルを付ける。
type:feature:
  - head-branch: ['^feature/']
type:fix:
  - head-branch: ['^fix/']
type:docs:
  - head-branch: ['^docs/']
type:chore:
  - head-branch: ['^chore/']
type:refactor:
  - head-branch: ['^refactor/']
type:test:
  - head-branch: ['^test/']

area:core:
  - changed-files:
      - any-glob-to-any-file: 'packages/core/**'
area:generator:
  - changed-files:
      - any-glob-to-any-file: ['packages/generator/**', 'scenarios/**']
area:ingest:
  - changed-files:
      - any-glob-to-any-file: ['packages/ingest/**', 'sources/**']
area:web:
  - changed-files:
      - any-glob-to-any-file: 'packages/web/**'
area:ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**', '.devcontainer/**', 'lefthook.yml', 'commitlint.config.js']
area:docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']
