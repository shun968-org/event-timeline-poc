name: Labeler

on:
  # フォークからの PR にもラベルを付けるため pull_request_target を使う。
  # コードはチェックアウトしない(ラベル付けだけを行う)。
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5

  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      BODY: ${{ github.event.issue.body }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      # タスクのテンプレートの「種類」の選択を type ラベルにする
      - name: 種類のラベル
        run: |
          type="$(printf '%s\n' "$BODY" | awk '/^### 種類/{f=1; next} f && NF {print; exit}')"
          case "$type" in
            feature|fix|docs|chore|refactor|test) gh issue edit "$NUMBER" --add-label "type:$type" ;;
          esac

      # 開発メンバー以外(公開デモの利用者)からの Issue を見分ける。
      # author_association は Organization のメンバーシップが非公開だと MEMBER にならないので、
      # リポジトリへの書き込み権限で判定する(公開リポジトリでは誰でも read になる)
      - name: 出どころのラベル
        if: github.event.action == 'opened'
        run: |
          permission="$(gh api "repos/$GH_REPO/collaborators/$AUTHOR/permission" --jq '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) gh issue edit "$NUMBER" --add-label "from:feedback" ;;
          esac
